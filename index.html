<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir UMKM</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>

    <div class="pos-container">

        <main class="products-section">
            <header class="top-bar">
                <div class="brand">
                    <div class="brand-icon">☕</div>
                    <div>
                        <h1 class="brand-name">Kasir UMKM</h1>
                        <span class="brand-sub">Point of Sale</span>
                    </div>
                </div>
                <div class="date-time" id="datetime"></div>
            </header>

            <div class="section-label">Menu</div>

            <!-- BARU: Search bar -->
            <div class="search-bar-wrapper">
                <span class="search-icon">⌕</span>
                <input type="text" id="search-input" class="search-bar" placeholder="Cari menu...">
                <button class="search-clear-btn hidden" id="search-clear-btn" title="Hapus pencarian">✕</button>
            </div>

            <div class="category-tabs">
                <button class="tab-btn active" data-category="all">Semua</button>
                <button class="tab-btn" data-category="coffee">Coffee</button>
                <button class="tab-btn" data-category="manis">Manis Manis</button>
                <button class="tab-btn" data-category="ringan">Makanan Ringan</button>
                <button class="tab-btn" data-category="berat">Makanan Berat</button>
            </div>

            <div id="product-grid" class="product-grid"></div>
        </main>

        <aside class="cart-section">
            <div class="cart-header">
                <h2 class="cart-title">Order</h2>
                <div class="cart-header-right">
                    <!-- BARU: Clear cart button -->
                    <button class="btn-clear-cart hidden" id="btn-clear-cart" title="Hapus semua item">Hapus Semua</button>
                    <span class="cart-badge" id="cart-count">0</span>
                </div>
            </div>
            <div id="cart-items" class="cart-items"></div>
            <div class="cart-footer">
                <div class="divider"></div>
                <!-- BARU: Item count line -->
                <div class="item-count-row" id="item-count-row" style="display:none;">
                    <span class="item-count-label" id="item-count-text"></span>
                </div>
                <div class="total-row">
                    <span class="total-label">Total</span>
                    <span id="total-price" class="total-price">Rp 0</span>
                </div>
                <div class="table-input-wrapper">
                    <input type="text" class="input-meja" placeholder="Nomor Meja (Cth: 04)" id="input-meja-desktop">
                </div>
                <div class="payment-buttons">
                    <button id="btn-cash" class="btn btn-cash" disabled>
                        <span>Cash</span>
                    </button>
                    <button id="btn-qris" class="btn btn-qris" disabled>
                        <span>QRIS</span>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Mobile bottom bar -->
    <button class="mobile-order-btn" id="mobile-order-btn">
        <div class="mobile-order-left">
            <span class="mobile-order-badge" id="mobile-cart-count">0</span>
            <span class="mobile-order-label">Lihat Order</span>
        </div>
        <span class="mobile-order-total" id="mobile-total-price">Rp 0</span>
    </button>

    <!-- Mobile cart overlay -->
    <div class="cart-overlay" id="cart-overlay">
        <div class="cart-overlay-backdrop" id="cart-overlay-backdrop"></div>
        <div class="cart-panel">
            <div class="cart-panel-handle"></div>
            <div class="cart-header">
                <h2 class="cart-title">Order</h2>
                <div class="cart-header-right">
                    <!-- BARU: Clear cart mobile -->
                    <button class="btn-clear-cart hidden" id="btn-clear-cart-mobile" title="Hapus semua item">Hapus Semua</button>
                    <span class="cart-badge" id="cart-count-mobile">0</span>
                </div>
            </div>
            <div id="cart-items-mobile" class="cart-items"></div>
            <div class="cart-footer">
                <div class="divider"></div>
                <div class="item-count-row" id="item-count-row-mobile" style="display:none;">
                    <span class="item-count-label" id="item-count-text-mobile"></span>
                </div>
                <div class="total-row">
                    <span class="total-label">Total</span>
                    <span id="total-price-mobile" class="total-price">Rp 0</span>
                </div>
                <div class="table-input-wrapper">
                    <input type="text" class="input-meja" placeholder="Nomor Meja (Cth: 04)" id="input-meja-mobile">
                </div>
                <div class="payment-buttons">
                    <button id="btn-cash-mobile" class="btn btn-cash" disabled>
                        <span>Cash</span>
                    </button>
                    <button id="btn-qris-mobile" class="btn btn-qris" disabled>
                        <span>QRIS</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- QRIS Modal -->
    <div id="qris-modal" class="modal hidden">
        <div class="modal-backdrop" id="qris-modal-backdrop"></div>
        <div class="modal-content">
            <button class="close-btn" id="close-modal">✕</button>
            <div class="modal-header">
                <div class="modal-icon">⚡</div>
                <h3>Scan & Bayar</h3>
                <p class="modal-subtitle">Arahkan kamera ke QR Code</p>
            </div>
            <div class="qr-wrapper">
                <img id="qris-image" src="" alt="QRIS Code">
                <div class="qr-corner tl"></div>
                <div class="qr-corner tr"></div>
                <div class="qr-corner bl"></div>
                <div class="qr-corner br"></div>
            </div>
            <div class="modal-amount">
                <span class="modal-amount-label">Total Pembayaran</span>
                <span id="modal-total-price" class="modal-amount-value">Rp 0</span>
            </div>
            <div class="waiting-indicator">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="waiting-text">Menunggu pembayaran</span>
            </div>
            <button id="btn-selesai" class="btn btn-selesai">✓ Konfirmasi Pembayaran</button>
        </div>
    </div>

    <!-- Notif Modal -->
    <div id="notif-modal" class="modal hidden">
        <div class="modal-backdrop" id="notif-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header" style="margin-bottom: 10px;">
                <div class="modal-icon" id="notif-icon">✅</div>
                <h3 id="notif-title">Sukses</h3>
                <p class="modal-subtitle" id="notif-desc" style="font-size: 0.95rem; line-height: 1.5; margin-top: 12px; color: var(--text-primary);">
                    Pesan notifikasi
                </p>
            </div>
            <button id="btn-tutup-notif" class="btn-selesai" style="margin-top: 20px;">Tutup</button>
        </div>
    </div>

    <script src="script.js?v=2.0"></script>
</body>
</html>
