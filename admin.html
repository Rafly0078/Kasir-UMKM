<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dapur / Admin - Kasir UMKM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2.0">
    <style>
        /* ── ADMIN CONTAINER ── */
        .admin-container { padding: 32px 40px 40px; }

        /* ── ORDER GRID ── */
        .order-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        /* ── ORDER CARD ── */
        .order-card {
            background: var(--bg-card);
            border: 1px solid var(--border-accent);
            border-radius: var(--radius-lg);
            padding: 20px;
            position: relative;
            transition: var(--transition);
            animation: cardAppear 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .order-card.completed {
            opacity: 0.45;
            border-color: var(--success);
        }

        /* ── ORDER HEADER ── */
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }
        .meja-badge {
            background: var(--accent);
            color: var(--bg-base);
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.05rem;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
        }
        .order-time { color: var(--text-muted); font-size: 0.82rem; }

        /* ── ORDER META: payment badge ── */
        .order-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .payment-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .payment-badge.cash {
            background: rgba(255,255,255,0.07);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .payment-badge.qris {
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid var(--border-accent);
        }

        /* ── ORDER ITEMS LIST ── */
        .order-items { list-style: none; margin-bottom: 14px; }
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
            font-size: 0.92rem;
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
        }
        .order-item:last-child { border-bottom: none; }
        .item-qty {
            font-weight: 700;
            color: var(--accent-text);
            margin-right: 6px;
        }
        .item-subtotal-admin {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* ── ORDER TOTAL ── */
        .order-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 14px;
            border-top: 1px solid var(--border);
        }
        .order-total-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .order-total-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.02em;
        }

        /* ── ACTION BUTTONS ── */
        .btn-antar {
            width: 100%;
            background: var(--success);
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: var(--radius-md);
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-antar:hover { background: #3d9e6a; transform: translateY(-1px); }

        .btn-konfirmasi {
            width: 100%;
            background: var(--accent);
            color: var(--bg-base);
            padding: 12px;
            border: none;
            border-radius: var(--radius-md);
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-konfirmasi:hover { background: var(--accent-dim); transform: translateY(-1px); }

        /* ── WAITING NOTICE ── */
        .waiting-notice {
            background: rgba(232, 160, 69, 0.1);
            border: 1px solid rgba(232, 160, 69, 0.25);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 14px;
            font-size: 0.82rem;
            color: var(--accent);
            text-align: center;
            font-weight: 600;
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
            font-size: 1rem;
        }
        .empty-state-icon { font-size: 3rem; opacity: 0.3; margin-bottom: 14px; }

        /* ── ADMIN HEADER EXTRAS ── */
        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ── STATUS BAR ── */
        .admin-status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .admin-live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
            animation: livePulse 2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(76,175,125,0.5); }
            50%       { opacity: 0.6; box-shadow: 0 0 0 5px rgba(76,175,125,0); }
        }
        .status-divider { color: var(--border); }
        .order-count-chip {
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid var(--border-accent);
            font-family: 'Syne', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 999px;
            margin-left: 4px;
        }

        /* ── NEW ORDER TOAST ── */
        .new-order-toast {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            background: var(--accent);
            color: var(--bg-base);
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 0.88rem;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            box-shadow: 0 8px 32px rgba(232,160,69,0.45);
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .new-order-toast.show { transform: translateX(0); }

        /* ── LOGOUT BUTTON ── */
        .btn-logout {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-logout:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
            background: rgba(255,107,107,0.08);
        }

        /* ── LOGIN PAGE ── */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg-base);
            padding: 20px;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-accent);
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 32px 80px rgba(0,0,0,0.6), var(--shadow-glow);
        }
        .login-card .brand-icon { margin: 0 auto 20px; }
        .login-title    { font-family: 'Syne', sans-serif; font-size: 1.6rem; color: var(--text-primary); margin-bottom: 6px; }
        .login-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 28px; }
        .input-group    { margin-bottom: 14px; text-align: left; }
        .error-text     { color: #ff6b6b; font-size: 0.85rem; margin-bottom: 16px; font-weight: 500; display: none; }

        .hidden { display: none !important; }

        /* ── RESPONSIVE ── */
        @media (max-width: 680px) {
            .admin-container { padding: 20px 16px 40px; }
            .order-grid { grid-template-columns: 1fr; gap: 16px; }
            .new-order-toast { top: auto; bottom: 24px; right: 16px; left: 16px; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════
         HALAMAN LOGIN
    ═══════════════════════════════════════ -->
    <div id="login-section" class="login-wrapper">
        <div class="login-card">
            <div class="brand-icon" style="font-size:2rem;">👨‍🍳</div>
            <h2 class="login-title">Login Dapur</h2>
            <p class="login-subtitle">Silakan masuk untuk melihat pesanan pelanggan</p>

            <div class="input-group">
                <input type="text" id="username" class="input-meja" placeholder="Username">
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-meja" placeholder="Password">
            </div>

            <p id="login-error" class="error-text">Username atau password salah!</p>

            <button id="btn-login" class="btn-antar" style="background: var(--accent); color: var(--bg-base);">
                Masuk
            </button>
        </div>
    </div>

    <!-- ═══════════════════════════════════════
         DASHBOARD ADMIN
    ═══════════════════════════════════════ -->
    <div id="admin-dashboard" class="admin-container hidden">

        <header class="top-bar">
            <div class="brand">
                <div class="brand-icon">👨‍🍳</div>
                <div>
                    <h1 class="brand-name">Layar Dapur</h1>
                    <span class="brand-sub">Pesanan Masuk</span>
                </div>
            </div>
            <div class="admin-header-right">
                <!-- Order count badge -->
                <span id="active-order-count" class="order-count-chip" style="display:none;">0</span>
                <button id="btn-logout" class="btn-logout">Logout</button>
            </div>
        </header>

        <!-- Status bar: live indicator + last refresh -->
        <div class="admin-status-bar">
            <span class="admin-live-dot"></span>
            <span>Live</span>
            <span class="status-divider">•</span>
            <span>Refresh otomatis setiap 5 detik</span>
            <span class="status-divider">•</span>
            <span>Terakhir: <strong id="last-refresh-time" style="color:var(--text-secondary);">—</strong></span>
        </div>

        <!-- Order grid -->
        <div id="admin-orders" class="order-grid"></div>
    </div>

    <!-- New order toast notification -->
    <div class="new-order-toast" id="new-order-toast">🔔 Pesanan baru masuk!</div>

    <script src="admin.js?v=2.0"></script>
</body>
</html>
