<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dapur / Admin - Kasir UMKM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.3">
    <style>
        /* --- GAYA KHUSUS ADMIN DAPUR --- */
        .admin-container { padding: 40px; }
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .order-card { background: var(--bg-card); border: 1px solid var(--border-accent); border-radius: var(--radius-lg); padding: 20px; position: relative; }
        .order-card.completed { opacity: 0.5; border-color: var(--success); }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 12px; margin-bottom: 16px; }
        .meja-badge { background: var(--accent); color: var(--bg-base); font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; padding: 4px 12px; border-radius: var(--radius-sm); }
        .order-time { color: var(--text-muted); font-size: 0.85rem; }
        .order-items { list-style: none; margin-bottom: 20px; }
        .order-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .item-qty { font-weight: 700; color: var(--accent-text); margin-right: 8px; }
        .btn-antar { width: 100%; background: var(--success); color: #fff; padding: 12px; border: none; border-radius: var(--radius-md); font-family: 'DM Sans', sans-serif; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-antar:hover { background: #3d9e6a; }
        .empty-state { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px; font-size: 1.1rem; }
        
        /* --- GAYA HALAMAN LOGIN --- */
        .login-wrapper { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg-base); padding: 20px; }
        .login-card { background: var(--bg-card); border: 1px solid var(--border-accent); border-radius: var(--radius-xl); padding: 40px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 32px 80px rgba(0,0,0,0.6), var(--shadow-glow); }
        .login-card .brand-icon { margin: 0 auto 20px; }
        .login-title { font-family: 'Syne', sans-serif; font-size: 1.6rem; color: var(--text-primary); margin-bottom: 6px; }
        .login-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .error-text { color: #ff6b6b; font-size: 0.85rem; margin-bottom: 16px; font-weight: 500; display: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-section" class="login-wrapper">
        <div class="login-card">
            <div class="brand-icon">👨‍🍳</div>
            <h2 class="login-title">Login Dapur</h2>
            <p class="login-subtitle">Silakan masuk untuk melihat pesanan pelanggan</p>
            
            <div class="input-group">
                <input type="text" id="username" class="input-meja" placeholder="Username (Cth: admin)">
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-meja" placeholder="Password (Cth: admin123)">
            </div>
            
            <p id="login-error" class="error-text">Username atau password salah!</p>
            
            <button id="btn-login" class="btn-antar" style="background: var(--accent); color: var(--bg-base);">Masuk</button>
        </div>
    </div>

    <div id="admin-dashboard" class="admin-container hidden">
        <header class="top-bar">
            <div class="brand">
                <div class="brand-icon">👨‍🍳</div>
                <div>
                    <h1 class="brand-name">Layar Dapur</h1>
                    <span class="brand-sub">Pesanan Masuk</span>
                </div>
            </div>
            <button id="btn-logout" class="btn-qty" style="width: auto; padding: 0 16px;">Logout</button>
        </header>

        <div id="admin-orders" class="order-grid">
            </div>
    </div>

    <script src="admin.js?v=1.3"></script>
</body>
</html>
